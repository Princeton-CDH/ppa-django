{{/* Base template: used only for pages that need head/header/footer but aren't
     list or single pages (e.g. the LIMITATIONS page). */}}
<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="page-content">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
