version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ppa
      POSTGRES_USER: ppa
      POSTGRES_PASSWORD: ppa
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppa"]
      interval: 5s
      timeout: 5s
      retries: 5

  solr:
    image: solr:9
    command: solr-precreate ppa
    environment:
      SOLR_MODULES: analysis-extras,scripting
    ports:
      - "8983:8983"
    volumes:
      - solr-data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8983/solr/ppa/admin/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  solr-data:


